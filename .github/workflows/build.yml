# Compila la app en cada pull request y en cada push a main, para ver si un cambio compila.
# No usa secretos ni identidades de firma y no publica nada: las versiones las publica macos/release.sh.
name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Una corrida por rama. En un PR, un push nuevo cancela la corrida anterior; en main, cada commit termina la
# suya, para que el badge del README diga si compiló y no «cancelado».
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (macOS 26)
    # macOS 26 en Apple silicon. Su Xcode por defecto (y cualquiera de los que trae) tiene el SDK de macOS 26:
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --show-sdk-version

      # Falla si Package.resolved no está al día con Package.swift, en vez de resolver otras versiones.
      - name: Resolve dependencies
        run: swift package --package-path macos --disable-keychain --force-resolved-versions resolve

      # El mismo script con el que se publica: swift build para Apple silicon e Intel, y el .app completo
      # (ícono, Info.plist, Sparkle). Firma ad hoc, sin identidad, y deja el .app en una carpeta temporal.
      - name: Build
        env:
          UNIVERSAL: 1
          SIGN_IDENTITY: '-'
          OUTPUT_DIR: ${{ runner.temp }}/app
        run: macos/build.sh

      # Que todo texto del código esté en el String Catalog y traducido al español (ver macos/strings.zsh).
      - name: Strings
        run: macos/strings.zsh --check
